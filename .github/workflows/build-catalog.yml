name: Build catalog

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'Optional CSV URL override'
        required: false
      assets_prefix:
        description: 'Optional assets prefix like giftfinder'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Shopify
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      THEME_ID: ${{ secrets.THEME_ID }}
      # Data inputs
      CSV_URL: ${{ github.event.inputs.csv_url || secrets.CSV_URL }}
      ASSETS_PREFIX: ${{ github.event.inputs.assets_prefix || secrets.ASSETS_PREFIX }}
      INCLUDE_OOS: '1'
      ALLOW_ZERO_PRICE: '0'
      # OpenAI
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Лучше сразу ставить безопасную «малую» модель
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          # Фиксируем версии, чтобы избежать несовместимостей
          pip install -r etl/requirements.txt || true
          pip install --upgrade "openai>=1.10.0" "jsonschema>=4.22.0" "gdown>=5.2.0" pandas python-slugify

      - name: Show repo tree
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la
          ls -la etl || true
          find . -maxdepth 2 -type f -print

      - name: Resolve CSV (Google Drive friendly)
        run: |
          set -e
          echo "Original CSV_URL: $CSV_URL"
          if echo "$CSV_URL" | grep -q 'drive.google.com/file/d/'; then
            FILE_ID=$(echo "$CSV_URL" | sed -n 's#.*drive.google.com/file/d/\([^/]*\)/.*#\1#p')
            echo "Detected Drive file id: $FILE_ID"
            gdown --id "$FILE_ID" -O /tmp/catalog.csv
            ls -lh /tmp/catalog.csv
            echo "CSV_URL=/tmp/catalog.csv" >> $GITHUB_ENV
            echo "Replaced CSV_URL with local file."
          fi

      - name: Validate CSV URL
        run: |
          set -e
          echo "CSV_URL=$CSV_URL"
          echo "---- HEAD ----"
          if echo "$CSV_URL" | grep -q '^/'; then
            echo "Local file detected, skipping HTTP HEAD"
          else
            curl -sSIL "$CSV_URL" || exit 1
          fi
          echo "---- first 400 bytes ----"
          if [ -f "$CSV_URL" ]; then
            head -c 400 "$CSV_URL" || true
          else
            curl -sSL "$CSV_URL" | head -c 400 || true
          fi
          echo
          echo "--------------"

      - name: Peek CSV (columns + 3 rows)
        run: |
          python - << 'PY'
          import os, pandas as pd, sys, urllib.request
          def read_head(p, n=4096):
            if os.path.isfile(p):
              with open(p,"rb") as f: return f.read(n)
            with urllib.request.urlopen(p) as r: return r.read(n)
          def guess(p):
            head = read_head(p).decode("utf-8", errors="ignore")
            lines = head.splitlines()
            skiprows = 0
            if lines and lines[0].strip().lower().startswith("products"):
              skiprows = 1
            header = lines[skiprows] if len(lines) > skiprows else ""
            sep = ";" if (";" in header and "," not in header) else None
            return sep, skiprows
          url = os.environ['CSV_URL']
          sep, skip = guess(url)
          try:
            df = pd.read_csv(url, nrows=3, dtype=str, keep_default_na=False,
                             sep=sep, skiprows=skip, engine="python", on_bad_lines="skip")
          except Exception as e:
            print("read_csv failed:", e, file=sys.stderr)
            try:
              df = pd.read_excel(url, dtype=str).head(3)
            except Exception as e2:
              print("read_excel failed:", e2, file=sys.stderr)
              df = None
          if df is not None and not df.empty:
            print("COLUMNS:", list(df.columns))
            print(df.to_string(index=False))
          else:
            print("CSV preview empty or failed.")
          PY

      - name: Verify env + ETL exists
        run: |
          test -n "$CSV_URL" || (echo "ERROR: CSV_URL is empty. Set repository secret CSV_URL or pass input." && exit 1)
          test -f etl/preprocess_catalog.py || (echo "ERROR: etl/preprocess_catalog.py not found" && exit 1)

      - name: Run ETL
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/etl/preprocess_catalog.py" > etl_output.txt
          echo "ETL output paths:"
          cat etl_output.txt

      - name: Parse ETL output paths
        id: paths
        run: |
          set -euo pipefail
          CATALOG=$(sed -n '1p' etl_output.txt)
          INDEX=$(sed -n '2p' etl_output.txt)
          echo "catalog_path=$CATALOG" >> $GITHUB_OUTPUT
          echo "index_path=$INDEX" >> $GITHUB_OUTPUT
          test -f "$CATALOG" || (echo "ERROR: catalog.min.json not produced at $CATALOG" && exit 1)
          test -f "$INDEX" || (echo "ERROR: index.min.json not produced at $INDEX" && exit 1)

      # --- Build compact AI catalog (for LLM) ---
      - name: Build compact AI catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          src = pathlib.Path("${{ steps.paths.outputs.catalog_path }}")
          dst = pathlib.Path("out/catalog_for_ai.json")
          with src.open("r", encoding="utf-8") as f:
            data = json.load(f)
          def inv_max(p):
            return max([v.get("inventory", 0) for v in p.get("variants", [])] + [0])
          compact = []
          for p in data[:1500]:
            compact.append({
              "id": p.get("product_id") or p.get("handle"),
              "title": p.get("title"),
              "type": " / ".join(p.get("tags", [])[:3]),
              "tags": p.get("tags", [])[:10],
              "status": "active",
              "published": True,
              "price": p.get("price"),
              "inventory_qty": inv_max(p),
              "image": p.get("primary_image"),
              "body_html": ""
            })
          dst.parent.mkdir(parents=True, exist_ok=True)
          with dst.open("w", encoding="utf-8") as f:
            json.dump(compact, f, ensure_ascii=False, separators=(",",":"))
          print(f"Wrote {dst} with {len(compact)} rows")
          PY

      # --- Generate quiz with OpenAI ---
      - name: Generate quiz with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import openai, sys
          print("openai version:", getattr(openai, "__version__", "unknown"))
          PY
          echo "=== Head of etl/generate_quiz_with_openai.py ==="
          sed -n '1,60p' etl/generate_quiz_with_openai.py || true
          python etl/generate_quiz_with_openai.py \
            --catalog_ai ./out/catalog_for_ai.json \
            --out ./out/quiz_output.json
          echo "---- quiz_output.json (head) ----"
          head -c 800 out/quiz_output.json || true
          echo

      - name: Upload catalog.min.json to Shopify assets
        env:
          FILE_PATH: ${{ steps.paths.outputs.catalog_path }}
        run: |
          set -euo pipefail
          ASSET_KEY="assets/catalog.min.json"
          if [ -n "${ASSETS_PREFIX}" ]; then
            ASSET_KEY="assets/${ASSETS_PREFIX}/catalog.min.json"
          fi
          base64 -w 0 "$FILE_PATH" > /tmp/file.b64
          printf '{"asset":{"key":"%s","attachment":"' "$ASSET_KEY" > /tmp/payload.json
          cat /tmp/file.b64 >> /tmp/payload.json
          printf '"}}' >> /tmp/payload.json
          HTTP_CODE=$(curl -sS -o resp.json -w "%{http_code}" -X PUT \
            "https://${SHOPIFY_STORE}/admin/api/2024-10/themes/${THEME_ID}/assets.json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP $HTTP_CODE"
          cat resp.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300 || (echo "Upload catalog failed" && exit 1)

      - name: Upload index.min.json to Shopify assets
        env:
          FILE_PATH: ${{ steps.paths.outputs.index_path }}
        run: |
          set -euo pipefail
          ASSET_KEY="assets/index.min.json"
          if [ -n "${ASSETS_PREFIX}" ]; then
            ASSET_KEY="assets/${ASSETS_PREFIX}/index.min.json"
          fi
          base64 -w 0 "$FILE_PATH" > /tmp/file.b64
          printf '{"asset":{"key":"%s","attachment":"' "$ASSET_KEY" > /tmp/payload.json
          cat /tmp/file.b64 >> /tmp/payload.json
          printf '"}}' >> /tmp/payload.json
          HTTP_CODE=$(curl -sS -o resp.json -w "%{http_code}" -X PUT \
            "https://${SHOPIFY_STORE}/admin/api/2024-10/themes/${THEME_ID}/assets.json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP $HTTP_CODE"
          cat resp.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300 || (echo "Upload index failed" && exit 1)

      - name: Upload quiz.json to Shopify assets
        run: |
          set -euo pipefail
          ASSET_KEY="assets/quiz.json"
          if [ -n "${ASSETS_PREFIX}" ]; then
            ASSET_KEY="assets/${ASSETS_PREFIX}/quiz.json"
          fi
          base64 -w 0 "out/quiz_output.json" > /tmp/file.b64
          printf '{"asset":{"key":"%s","attachment":"' "$ASSET_KEY" > /tmp/payload.json
          cat /tmp/file.b64 >> /tmp/payload.json
          printf '"}}' >> /tmp/payload.json
          HTTP_CODE=$(curl -sS -o resp.json -w "%{http_code}" -X PUT \
            "https://${SHOPIFY_STORE}/admin/api/2024-10/themes/${THEME_ID}/assets.json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP $HTTP_CODE"
          cat resp.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300 || (echo "Upload quiz failed" && exit 1)
